name: Daily Inventory Import

on:
  schedule:
    # 06:00 UTC every day (2 AM Eastern in summer, 1 AM in winter).
    # Scheduled runs use the workflow and code on the repository's default branch.
    - cron: '0 6 * * *'
  # Allow a manual run from the GitHub Actions UI or via the GitHub API
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: download and check the feed, report what would change, write nothing'
        type: boolean
        default: false
      allow_mass_deactivation:
        description: 'Allow a dealer to lose more than half of its listings in one run'
        type: boolean
        default: false

# Never run two imports at the same time.
concurrency:
  group: inventory-import
  cancel-in-progress: false

jobs:
  import:
    name: Import CSV inventory from SFTP → Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run inventory import
        run: pnpm --filter @workspace/ingestion run import $IMPORT_FLAGS
        env:
          IMPORT_FLAGS: ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.allow_mass_deactivation && '--allow-mass-deactivation' || '' }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
